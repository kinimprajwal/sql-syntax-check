[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-syntax-check"
version = "0.1.0"
description = "Dialect-aware SQL syntax checker (T-SQL, Snowflake, extensible) for repo-based platforms"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "sqlfluff>=3.0.0",
]

[project.scripts]
sql-syntax-check = "engine.sql_syntax_check:main"

[tool.setuptools]
packages = ["engine"]
